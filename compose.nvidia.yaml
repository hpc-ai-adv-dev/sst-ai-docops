# ─────────────────────────────────────────────────────────────────────────────
# NVIDIA overlay – used by start.sh when PLATFORM=nvidia
#   podman compose -f compose.yaml -f compose.nvidia.yaml up -d
#
# Prerequisites on the host:
#   1. nvidia-container-toolkit installed
#   2. CDI manifest generated:
#        sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#   3. Podman 4.1+ (ships with RHEL 9 / Fedora 37+)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── LLM (chat / completions) ─────────────────────── internal port 8080 ──
  llama-llm:
    image: ghcr.io/ggml-org/llama.cpp@sha256:9f0a986a78ab9261afc3266c807c16933ee4c26c62cb063f0c17f8da890f6c7e
    container_name: llama-llm
    devices:
      - nvidia.com/gpu=all          # CDI passthrough – requires nvidia-container-toolkit
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/Qwen3-14B-Q4_K_M.gguf
      --alias Qwen3-14B-Q4_K_M.gguf
      --ctx-size 8192
      --n-gpu-layers -1
      --log-disable
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ── Embeddings ───────────────────────────────────── internal port 8080 ──
  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp@sha256:9f0a986a78ab9261afc3266c807c16933ee4c26c62cb063f0c17f8da890f6c7e
    container_name: llama-embed
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/nomic-embed-text-v1.5.Q8_0.gguf
      --alias nomic-embed-text-v1.5.Q8_0.gguf
      --ctx-size 8192
      --n-gpu-layers -1
      --embedding
      --cache-ram 0
      --no-cache-prompt
      --pooling mean
      --log-disable
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ── Reranker ─────────────────────────────────────── internal port 8080 ──
  llama-rerank:
    image: ghcr.io/ggml-org/llama.cpp@sha256:9f0a986a78ab9261afc3266c807c16933ee4c26c62cb063f0c17f8da890f6c7e
    container_name: llama-rerank
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/bge-reranker-v2-m3-Q8_0.gguf
      --alias bge-reranker-v2-m3-Q8_0.gguf
      --ctx-size 8192
      --n-gpu-layers -1
      --reranking
      --log-disable
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ── Override open-webui to use the container service URLs ─────────────────
  # env_file (from base compose.yaml) provides all other vars; only URLs
  # that differ from the mac-host defaults need to be overridden here.
  open-webui:
    environment:
      OPENAI_API_BASE_URL: http://llama-llm:8080/v1
      RAG_OPENAI_API_BASE_URL: http://llama-embed:8080/v1
      # Full reranker endpoint path is required by Open WebUI.
      RAG_EXTERNAL_RERANKER_URL: http://llama-rerank:8080/v1/rerank
    depends_on:
      llama-llm:
        condition: service_healthy
      llama-embed:
        condition: service_healthy
      llama-rerank:
        condition: service_healthy
